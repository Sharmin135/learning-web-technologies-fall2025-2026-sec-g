<html>
<html lang="en">
<head>
    <title>Name Validation</title>
</head>
<body>

    <form onsubmit="return test()">
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" value="" onblur="validateName()" /><br>
        <p id="nError"></p>

        <input type="submit" value="Submit" />
    </form>

    <script>
        let nameField = document.getElementById('name');
        let nError = document.getElementById('nError');

        function validateName() {
            let name = nameField.value.trim();

            
            if (name === "") {
                nError.innerHTML = "Name cannot be empty!";
                nError.style.color = "red";
                return false;
            }

        
            let words = name.split(" ").filter(word => word !== "");
            if (words.length < 2) {
                nError.innerHTML = "Name must contain at least two words!";
                nError.style.color = "red";
                return false;
            }

        

            nError.innerHTML = "Valid name!";
            nError.style.color = "green";
            return true;
        }

        function test() {
            return validateName();
        }
    </script>

</body>
</html>
